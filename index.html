<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tasks">
<meta name="theme-color" content="#f5f8f3">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Task Calendar</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f8f3;
    --bg2: #e9f0e6;
    --bg3: #d8e4d6;
    --surface: #ffffff;
    --text: #19231b;
    --text2: #425544;
    --text3: #66746a;
    --border: rgba(48, 78, 54, 0.26);
    --border2: rgba(48, 78, 54, 0.42);
    --accent: #496f50;
    --accent-bg: #d8eadc;
    --accent-text: #254b2e;
    --green: #2f7442;
    --green-bg: #d8ecd7;
    --blue: #2d6f91;
    --blue-bg: #d9eaf1;
    --today-bg: #cfe5ee;
    --today-border: rgba(45, 111, 145, 0.28);
    --task-col: min(76vw, 240px);
    --task-col-compact: 54px;
    --day-col: 52px;
    --radius: 10px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bot);
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .brand-logo {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    object-fit: contain;
    background: #fffefa;
    border: 1px solid var(--border2);
    padding: 3px;
    flex-shrink: 0;
  }
  .header-title { font-size: 20px; font-weight: 700; color: var(--text); white-space: nowrap; }
  .week-nav { display: flex; align-items: center; gap: 6px; }
  .week-label { font-size: 13px; color: var(--text2); min-width: 90px; text-align: center; }
  .nav-btn {
    width: 30px; height: 30px; border-radius: 8px;
    border: 1px solid var(--border2); background: var(--surface);
    color: var(--text); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-btn:active { background: var(--bg3); }

  /* Legend */
  .legend {
    display: flex; gap: 10px; padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0; overflow-x: auto;
  }
  .leg { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text2); white-space: nowrap; }
  .leg-dot { width: 14px; height: 14px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 9px; border: 1px solid var(--border2); }

  /* Scrollable table area */
  .table-area { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; }

  table {
    border-collapse: collapse;
    min-width: 100%;
    width: max-content;
  }

  /* Sticky header row */
  thead th {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg2);
    font-size: 11px; font-weight: 700; color: var(--text2);
    padding: 8px 4px; text-align: center;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    white-space: nowrap;
  }
  thead th:not(.task-hd),
  tbody td.day-cell {
    width: var(--day-col);
    min-width: var(--day-col);
    max-width: var(--day-col);
  }
  thead th.task-hd {
    text-align: left;
    padding-left: 12px;
    width: var(--task-col);
    min-width: var(--task-col);
    max-width: var(--task-col);
    position: sticky;
    left: 0;
    z-index: 20;
    overflow: hidden;
    transition: width 0.16s ease, min-width 0.16s ease, max-width 0.16s ease, padding 0.16s ease;
  }

  /* Sticky first column */
  tbody td.task-cell {
    position: sticky; left: 0; z-index: 5;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 0;
    width: var(--task-col);
    min-width: var(--task-col);
    max-width: var(--task-col);
    overflow: hidden;
    transition: width 0.16s ease, min-width 0.16s ease, max-width 0.16s ease;
  }
  .task-cell-inner {
    display: flex; align-items: center; gap: 4px;
    padding: 8px 6px 8px 12px;
    min-width: 0;
    width: 100%;
    transition: padding 0.16s ease;
  }
  .task-name-text {
    font-size: 13px;
    font-weight: 500;
    flex: 1;
    min-width: 0;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .task-name-input {
    font-size: 13px; font-weight: 500; flex: 1;
    background: transparent; border: none; color: var(--text);
    outline: none; width: 100%;
    border-bottom: 1px solid var(--accent);
  }
  .del-btn { background: none; border: none; color: var(--text3); font-size: 14px; cursor: pointer; padding: 2px; flex-shrink: 0; }

  .table-area.compact-tasks thead th.task-hd,
  .table-area.compact-tasks tbody td.task-cell {
    width: var(--task-col-compact);
    min-width: var(--task-col-compact);
    max-width: var(--task-col-compact);
  }
  .table-area.compact-tasks thead th.task-hd {
    padding-left: 0;
    text-align: center;
  }
  .table-area.compact-tasks .task-cell-inner {
    justify-content: center;
    padding: 8px 5px;
  }
  .table-area.compact-tasks .task-name-text {
    flex: 0 1 auto;
    width: 42px;
    text-align: center;
  }
  .table-area.compact-tasks .del-btn {
    display: none;
  }

  /* Day cells */
  tbody td.day-cell {
    padding: 6px 4px; text-align: center;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  tbody tr:last-child td { border-bottom: none; }

  td.today-cell {
    background: var(--today-bg) !important;
    box-shadow: inset 1px 0 0 var(--today-border), inset -1px 0 0 var(--today-border);
  }
  thead th.today-hd {
    background: var(--today-bg) !important;
    color: var(--blue) !important;
    box-shadow: inset 1px 0 0 var(--today-border), inset -1px 0 0 var(--today-border);
  }

  .status-btn {
    width: 34px; height: 34px; border-radius: 8px;
    border: 1.5px solid var(--border2);
    background: var(--surface);
    color: var(--text2);
    font-size: 16px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 2px rgba(31, 47, 35, 0.12);
    transition: transform 0.08s, border-color 0.08s, background 0.08s;
  }
  .status-btn:active { transform: scale(0.9); }
  .status-btn.empty { background: #fffefa; }
  .today-cell .status-btn.empty { border-color: rgba(45, 89, 110, 0.52); }
  .status-btn.done { background: var(--green-bg); border-color: var(--green); color: var(--green); font-weight: 700; }
  .status-btn.inprog { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); font-weight: 700; }

  /* Add task row */
  .add-row td {
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    position: sticky; left: 0;
  }
  .add-form { display: flex; gap: 8px; align-items: center; }
  .add-input {
    flex: 1; height: 36px; padding: 0 10px;
    border: 1px solid var(--border2); border-radius: 8px;
    background: var(--surface); color: var(--text);
    font-size: 14px; outline: none;
  }
  .add-input:focus { border-color: var(--accent); }
  .add-btn {
    height: 36px; padding: 0 14px; border-radius: 8px;
    border: 1px solid var(--accent); background: var(--accent-bg);
    color: var(--accent-text); font-size: 14px; font-weight: 700; cursor: pointer;
    white-space: nowrap;
  }
  .add-btn:active { opacity: 0.7; }

  /* Install banner */
  .install-banner {
    background: var(--accent-bg); color: var(--accent-text);
    font-size: 12px; padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .install-banner button { background: none; border: none; color: var(--accent-text); font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <div id="install-banner" class="install-banner" style="display:none">
    <span>📲 Tap <strong>Share → Add to Home Screen</strong> to install</span>
    <button onclick="document.getElementById('install-banner').style.display='none'">✕</button>
  </div>

  <div class="header">
    <div class="brand">
      <img class="brand-logo" src="ISKCON_logo.svg.png" alt="ISKCON logo">
      <div class="header-title">Task Calendar</div>
    </div>
    <div class="week-nav">
      <button class="nav-btn" onclick="changeWeek(-1)">‹</button>
      <div class="week-label" id="week-label"></div>
      <button class="nav-btn" onclick="changeWeek(1)">›</button>
    </div>
  </div>

  <div class="legend">
    <div class="leg"><div class="leg-dot" style="background:var(--bg)"></div>Empty</div>
    <div class="leg"><div class="leg-dot" style="background:var(--blue-bg);border-color:var(--blue);color:var(--blue)">⏱</div>In progress</div>
    <div class="leg"><div class="leg-dot" style="background:var(--green-bg);border-color:var(--green);color:var(--green)">✓</div>Done</div>
    <div class="leg" style="margin-left:auto;color:var(--text3);font-size:10px">Tap name to edit</div>
  </div>

  <div class="table-area">
    <table id="cal-table"></table>
  </div>
</div>

<script>
const DAYS_SHORT = ['Su','Mo','Tu','We','Th','Fr','Sa'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const STORE_KEY = 'taskcal_v1';

let weekOffset = 0;
let editingTaskId = null;

function load() {
  try {
    const saved = localStorage.getItem(STORE_KEY);
    if (saved) return normalizeState(JSON.parse(saved));
  } catch(e) {}
  return {
tasks: [
      { id: 1, name: 'Brahmamuhrat Sanan' },
      { id: 2, name: 'Deep Dan' },
      { id: 3, name: 'Offer Tulsi to Lord' },
      { id: 4, name: 'Dham Yatra' },
      { id: 5, name: 'Gita Chapter 15 / Krishna Book' },
      { id: 6, name: 'Start Chanting' },
      { id: 7, name: 'Temple Visit and Granth Reading' },
    ],
    cells: {},
    nextId: 8
  };
}

function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e) {} }

let state = load();

function normalizeState(data) {
  if (!data || typeof data !== 'object') return data;
  if (data.cells && typeof data.cells === 'object') {
    Object.keys(data.cells).forEach(k => {
      if (data.cells[k] === 'blocked') delete data.cells[k];
    });
  }
  return data;
}

function getWeekDates(offset) {
  const today = new Date();
  const dow = today.getDay();
  const monday = new Date(today);
  monday.setDate(today.getDate() - dow + 1 + offset * 7);
  return Array.from({length: 7}, (_, i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return d;
  });
}

function dateKey(d) { return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }

function cycleStatus(taskId, dk) {
  const k = `${taskId}_${dk}`;
  const order = ['empty','inprog','done'];
  const cur = state.cells[k] || 'empty';
  const next = order[(order.indexOf(cur) + 1) % order.length];
  if (next === 'empty') delete state.cells[k];
  else state.cells[k] = next;
  save();
  render();
}

function statusIcon(s) {
  if (s === 'done') return '✓';
  if (s === 'inprog') return '⏱';
  return '';
}

function deleteTask(id) {
  state.tasks = state.tasks.filter(t => t.id !== id);
  save(); render();
}

function startEdit(id) {
  editingTaskId = id;
  render();
  setTimeout(() => {
    const inp = document.getElementById(`task-input-${id}`);
    if (inp) { inp.focus(); inp.select(); }
  }, 50);
}

function finishEdit(id) {
  const inp = document.getElementById(`task-input-${id}`);
  if (inp) {
    const t = state.tasks.find(t => t.id === id);
    if (t) { t.name = inp.value.trim() || t.name; }
  }
  editingTaskId = null;
  save(); render();
}

function addTask() {
  const inp = document.getElementById('add-input');
  const name = inp.value.trim();
  if (!name) return;
  state.tasks.push({ id: state.nextId++, name });
  inp.value = '';
  save(); render();
}

function changeWeek(delta) { weekOffset += delta; render(); }

function render() {
  const dates = getWeekDates(weekOffset);
  const today = new Date();
  const todayDk = dateKey(today);

  // Week label
  const first = dates[0], last = dates[6];
  document.getElementById('week-label').textContent =
    `${first.getDate()} ${MONTHS[first.getMonth()]} – ${last.getDate()} ${MONTHS[last.getMonth()]}`;

  let html = '<thead><tr>';
  html += `<th class="task-hd">Task</th>`;
  dates.forEach(d => {
    const isT = dateKey(d) === todayDk;
    html += `<th class="${isT ? 'today-hd' : ''}">${DAYS_SHORT[d.getDay()]}<br><span style="font-size:10px;font-weight:700;color:${isT ? 'var(--blue)' : 'var(--text3)'}">${d.getDate()}</span></th>`;
  });
  html += '</tr></thead><tbody>';

  state.tasks.forEach(task => {
    html += '<tr>';
    if (editingTaskId === task.id) {
      html += `<td class="task-cell"><div class="task-cell-inner"><input id="task-input-${task.id}" class="task-name-input" value="${task.name.replace(/"/g,'&quot;')}" onblur="finishEdit(${task.id})" onkeydown="if(event.key==='Enter')finishEdit(${task.id})" /></div></td>`;
    } else {
      html += `<td class="task-cell"><div class="task-cell-inner"><span class="task-name-text" onclick="startEdit(${task.id})" title="Tap to edit">${task.name}</span><button class="del-btn" onclick="deleteTask(${task.id})" aria-label="Delete">✕</button></div></td>`;
    }
    dates.forEach(d => {
      const dk = dateKey(d);
      const isT = dk === todayDk;
      const s = state.cells[`${task.id}_${dk}`] || 'empty';
      html += `<td class="day-cell${isT ? ' today-cell' : ''}"><button class="status-btn ${s}" onclick="cycleStatus(${task.id},'${dk}')" aria-label="${task.name} ${DAYS_SHORT[d.getDay()]}: ${s}">${statusIcon(s)}</button></td>`;
    });
    html += '</tr>';
  });

  // Add task row
  html += `<tr class="add-row"><td colspan="${1 + dates.length}"><div class="add-form"><input id="add-input" class="add-input" placeholder="Add a task…" onkeydown="if(event.key==='Enter')addTask()" /><button class="add-btn" onclick="addTask()">+ Add</button></div></td></tr>`;
  html += '</tbody>';
  document.getElementById('cal-table').innerHTML = html;
  requestAnimationFrame(updateTaskColumnMode);
}

function updateTaskColumnMode() {
  const area = document.querySelector('.table-area');
  if (!area) return;
  area.classList.toggle('compact-tasks', area.scrollLeft > 24 && editingTaskId === null);
}

document.querySelector('.table-area').addEventListener('scroll', updateTaskColumnMode, { passive: true });

// Show install banner on iOS if not in standalone
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
if (isIOS && !isStandalone) {
  document.getElementById('install-banner').style.display = 'flex';
}

// Service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

render();
</script>
</body>
</html>
